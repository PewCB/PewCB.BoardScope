# TEMPORARY X-ONLY TEST FROM 100 MM AWAY.
# Threshold 30 is provisional; maximum homing search is temporarily 110 mm.
board: ESP32-S3 Super Mini custom controller
name: CoreXY Microscope Stage - bounded X StallGuard test
stepping:
  engine: Timed
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0
uart1:
  txd_pin: gpio.1
  rxd_pin: gpio.2
  baud: 115200
  mode: 8N1
kinematics:
  CoreXY:
    x_scaler: 1.0
axes:
  shared_stepper_disable_pin: gpio.8
  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 200
    max_travel_mm: 110
    soft_limits: false
    motor0:
      limit_neg_pin: gpio.9:pd
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 0
        step_pin: gpio.10
        direction_pin: gpio.6:low
        disable_pin: NO_PIN
        r_sense_ohms: 0.11
        run_amps: 0.5
        hold_amps: 0.25
        microsteps: 16
        run_mode: StealthChop
        homing_mode: StallGuard
        homing_amps: 0.5
        stallguard: 30
        stallguard_debug: true
    homing:
      cycle: 0
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0
      seek_mm_per_min: 600
      feed_mm_per_min: 600
      settle_ms: 300
      seek_scaler: 1.0
      feed_scaler: 1.0
  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 200
    max_travel_mm: 300
    soft_limits: false
    motor0:
      limit_neg_pin: gpio.7:pd
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 1
        step_pin: gpio.5
        direction_pin: gpio.4:low
        disable_pin: NO_PIN
        r_sense_ohms: 0.11
        run_amps: 0.5
        hold_amps: 0.25
        microsteps: 16
        run_mode: StealthChop
        homing_mode: StallGuard
        homing_amps: 0.5
        stallguard: 0
        stallguard_debug: false
  homing_runs: 1
start:
  must_home: false
  check_limits: false
